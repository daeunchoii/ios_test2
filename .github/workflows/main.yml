
name: iOS Unsigned IPA Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Check Project Files
        run: |
          pwd
          ls -la
          find . -name "*.xcodeproj"
          find . -name "*.xcworkspace"

      - name: Grant Execute Permissions
        run: |
          find . -name "*.sh" -exec chmod +x {} \; || true

      - name: Build Unsigned App
        run: |
          set -o pipefail

          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$PWD/build_output" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            clean build

      - name: Package to IPA
        run: |
          set -e

          mkdir -p Payload

          APP_PATH=$(find build_output/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi

          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -r app-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: app-unsigned.ipa
          retention-days: 7
